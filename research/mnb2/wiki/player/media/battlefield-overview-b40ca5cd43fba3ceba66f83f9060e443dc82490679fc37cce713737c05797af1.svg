<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>Plan by threat and job</title><desc>A conceptual battlefield diagram separates incoming threats, a protected infantry position and specialist support, without claiming geometric protection.</desc><g font-family="sans-serif"><rect x="2" y="2" width="956" height="596" rx="12" fill="#101819" stroke="#82928c" stroke-width="3"/><text x="30" y="48" font-size="32" fill="#f4cc83" font-weight="bold">Plan by threat and job</text><text x="30" y="85" font-size="23" fill="#e2eaea" font-weight="normal">Historical selected 2.3.1g · conceptual teaching diagram</text><rect x="30" y="110" width="900" height="390" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><text x="70" y="153" font-size="27" fill="#f4cc83" font-weight="normal">Incoming infantry / armor / indirect fire</text><line x1="260" y1="175" x2="260" y2="260" stroke="#e7c574" stroke-width="4"/><line x1="700" y1="175" x2="700" y2="260" stroke="#e7c574" stroke-width="4"/><rect x="85" y="285" width="345" height="150" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><text x="105" y="328" font-size="27" fill="#e2eaea" font-weight="normal">Infantry position</text><text x="105" y="370" font-size="24" fill="#e2eaea" font-weight="normal">Watch the actual threat.</text><text x="105" y="408" font-size="24" fill="#e2eaea" font-weight="normal">Cover has exceptions.</text><rect x="480" y="285" width="395" height="150" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><text x="500" y="328" font-size="27" fill="#e2eaea" font-weight="normal">Support / armor response</text><text x="500" y="370" font-size="24" fill="#e2eaea" font-weight="normal">Check role and eligibility.</text><text x="500" y="408" font-size="24" fill="#e2eaea" font-weight="normal">Keep explosive risks in mind.</text><text x="45" y="535" font-size="23" fill="#e2eaea" font-weight="normal">Adapt when threats change; this is not a recommended coordinate map.</text><text x="30" y="570" font-size="22" fill="#bfcac5" font-weight="normal">Not a screenshot, scale drawing or tested safe placement.</text></g></svg>
