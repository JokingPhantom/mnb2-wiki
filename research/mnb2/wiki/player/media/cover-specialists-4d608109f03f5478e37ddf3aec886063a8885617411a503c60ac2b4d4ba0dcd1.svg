<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>Protection and ability are different questions</title><desc>A decision diagram asks separately whether cover protects against the incoming attack and whether the specialist can perform its action.</desc><g font-family="sans-serif"><rect x="2" y="2" width="956" height="596" rx="12" fill="#101819" stroke="#82928c" stroke-width="3"/><text x="30" y="48" font-size="32" fill="#f4cc83" font-weight="bold">Protection and ability are different questions</text><text x="30" y="85" font-size="23" fill="#e2eaea" font-weight="normal">Historical selected 2.3.1g · conceptual teaching diagram</text><rect x="40" y="120" width="880" height="95" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><text x="70" y="162" font-size="29" fill="#e2eaea" font-weight="normal">Chosen structure + soldier position + attacker</text><text x="70" y="195" font-size="23" fill="#e2eaea" font-weight="normal">Visible overlap alone does not prove a protection query.</text><line x1="300" y1="215" x2="260" y2="285" stroke="#e7c574" stroke-width="4"/><line x1="660" y1="215" x2="700" y2="285" stroke="#e7c574" stroke-width="4"/><rect x="40" y="285" width="420" height="190" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><text x="65" y="325" font-size="26" fill="#e2eaea" font-weight="normal">Does this attack check cover?</text><text x="65" y="365" font-size="24" fill="#e2eaea" font-weight="normal">Ordinary and bunker saves</text><text x="65" y="400" font-size="24" fill="#e2eaea" font-weight="normal">are separate; exceptions apply.</text><text x="65" y="440" font-size="24" fill="#e2eaea" font-weight="normal">No universal damage immunity.</text><rect x="500" y="285" width="420" height="190" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><text x="525" y="325" font-size="26" fill="#e2eaea" font-weight="normal">Can the specialist do its job?</text><text x="525" y="365" font-size="24" fill="#e2eaea" font-weight="normal">Mechanic repair excludes</text><text x="525" y="400" font-size="23" fill="#e2eaea" font-weight="normal">bunker / palisade classification.</text><text x="525" y="440" font-size="24" fill="#e2eaea" font-weight="normal">Medic direct gates differ.</text><text x="45" y="525" font-size="25" fill="#e2eaea" font-weight="normal">Check the role article; protection does not guarantee ability use.</text><text x="30" y="570" font-size="22" fill="#bfcac5" font-weight="normal">Not a screenshot, scale drawing or tested safe placement.</text></g></svg>
