<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>A marker is an order, not an arrival receipt</title><desc>Three stages show selection, destination marker and verification of actual movement; if movement fails, inspect pending choices, state and obstacles.</desc><g font-family="sans-serif"><rect x="2" y="2" width="956" height="596" rx="12" fill="#101819" stroke="#82928c" stroke-width="3"/><text x="30" y="48" font-size="32" fill="#f4cc83" font-weight="bold">A marker is an order, not an arrival receipt</text><text x="30" y="85" font-size="23" fill="#e2eaea" font-weight="normal">Historical selected 2.3.1g · conceptual teaching diagram</text><rect x="35" y="135" width="280" height="255" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="80" cy="185" r="22" fill="#d8e6a7"/><text x="72" y="194" font-size="24" fill="#101819" font-weight="bold">1</text><text x="65" y="245" font-size="27" fill="#e2eaea" font-weight="normal">Select a soldier</text><text x="65" y="290" font-size="24" fill="#e2eaea" font-weight="normal">Check selection</text><text x="65" y="325" font-size="24" fill="#e2eaea" font-weight="normal">feedback.</text><rect x="340" y="135" width="280" height="255" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="385" cy="185" r="22" fill="#d8e6a7"/><text x="377" y="194" font-size="24" fill="#101819" font-weight="bold">2</text><text x="365" y="245" font-size="25" fill="#e2eaea" font-weight="normal">Choose destination</text><text x="365" y="290" font-size="24" fill="#e2eaea" font-weight="normal">A marker records</text><text x="365" y="325" font-size="24" fill="#e2eaea" font-weight="normal">the order.</text><rect x="645" y="135" width="280" height="255" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="690" cy="185" r="22" fill="#d8e6a7"/><text x="682" y="194" font-size="24" fill="#101819" font-weight="bold">3</text><text x="670" y="245" font-size="26" fill="#e2eaea" font-weight="normal">Watch movement</text><text x="670" y="290" font-size="24" fill="#e2eaea" font-weight="normal">Confirm actual</text><text x="670" y="325" font-size="24" fill="#e2eaea" font-weight="normal">displacement.</text><line x1="315" y1="265" x2="340" y2="265" stroke="#e7c574" stroke-width="4"/><line x1="620" y1="265" x2="645" y2="265" stroke="#e7c574" stroke-width="4"/><text x="45" y="445" font-size="24" fill="#e2eaea" font-weight="normal">Still stationary? Check pending equipment/orders, pinning, morale,</text><text x="45" y="485" font-size="24" fill="#e2eaea" font-weight="normal">aiming and obstacles. Do not keep spending to force movement.</text><text x="30" y="570" font-size="22" fill="#bfcac5" font-weight="normal">Not a screenshot, scale drawing or tested safe placement.</text></g></svg>
