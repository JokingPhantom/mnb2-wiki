<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>Recognize the job before the silhouette</title><desc>Conceptual symbols label ordinary infantry, anti-tank specialist, Medic and weapon upgrade; these are not historical game icons.</desc><g font-family="sans-serif"><rect x="2" y="2" width="956" height="596" rx="12" fill="#101819" stroke="#82928c" stroke-width="3"/><text x="30" y="48" font-size="32" fill="#f4cc83" font-weight="bold">Recognize the job before the silhouette</text><text x="30" y="85" font-size="23" fill="#e2eaea" font-weight="normal">Historical selected 2.3.1g · conceptual teaching diagram</text><rect x="35" y="120" width="420" height="150" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="85" cy="175" r="22" fill="#d8e6a7"/><text x="77" y="184" font-size="24" fill="#101819" font-weight="bold">I</text><text x="125" y="170" font-size="28" fill="#e2eaea" font-weight="normal">Ordinary infantry</text><text x="125" y="215" font-size="25" fill="#e2eaea" font-weight="normal">General firearm role</text><rect x="505" y="120" width="420" height="150" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="555" cy="175" r="22" fill="#d8e6a7"/><text x="547" y="184" font-size="24" fill="#101819" font-weight="bold">A</text><text x="595" y="170" font-size="27" fill="#e2eaea" font-weight="normal">Bazooka specialist</text><text x="595" y="215" font-size="25" fill="#e2eaea" font-weight="normal">Anti-vehicle job</text><rect x="35" y="305" width="420" height="150" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="85" cy="360" r="22" fill="#d8e6a7"/><text x="77" y="369" font-size="24" fill="#101819" font-weight="bold">M</text><text x="125" y="355" font-size="28" fill="#e2eaea" font-weight="normal">Medic</text><text x="125" y="400" font-size="23" fill="#e2eaea" font-weight="normal">Healing; not a gun upgrade</text><rect x="505" y="305" width="420" height="150" rx="12" fill="#233638" stroke="#82928c" stroke-width="3"/><circle cx="555" cy="360" r="22" fill="#d8e6a7"/><text x="547" y="369" font-size="24" fill="#101819" font-weight="bold">W</text><text x="595" y="355" font-size="27" fill="#e2eaea" font-weight="normal">Weapon equipment</text><text x="595" y="400" font-size="24" fill="#e2eaea" font-weight="normal">Check eligible recipient</text><text x="45" y="515" font-size="23" fill="#e2eaea" font-weight="normal">Use named menu offers and the article, not these invented symbols, in play.</text><text x="30" y="570" font-size="22" fill="#bfcac5" font-weight="normal">Not a screenshot, scale drawing or tested safe placement.</text></g></svg>
